name: s2s_translator
description: Speech-to-Speech Translator — English to French & Twi
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  record: ^5.1.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  just_audio: ^0.9.44

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/